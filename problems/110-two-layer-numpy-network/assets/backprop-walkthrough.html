<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two layers, one gradient at a time</title>
<style>
:root{--bg:#f6f8fc;--surface:#fff;--text:#182b43;--muted:#516780;--border:#d3dfeb;--accent:#246dcc;--soft:#eaf2ff;--green:#207760}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.demo{max-width:620px;margin:auto;padding:20px}h1{font-size:24px;line-height:1.2;margin:6px 0 12px}h2{font-size:22px;line-height:1.25;margin:12px 0}p{margin:10px 0}.eyebrow,small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase}button,select,input{font:inherit}button,select{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav select{flex:1;min-width:150px;width:100%}.scene{margin:16px 0;padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface);min-height:560px;display:flex;flex-direction:column;gap:8px}.equation{font:20px/1.65 ui-monospace,monospace;overflow-wrap:anywhere;padding:12px;background:var(--soft);border-left:3px solid var(--accent);border-radius:5px}.figure{margin:8px 0;display:grid;gap:10px}.tile{padding:12px;border:1px solid var(--border);border-radius:10px}.tile strong{color:var(--accent)}.arrow{text-align:center;color:var(--accent);font-size:22px;line-height:1}.numbers{font:14px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.matrix{display:grid;gap:4px;margin:6px 0}.cell{padding:5px;text-align:center;border:1px solid var(--border);border-radius:4px}.selected{background:var(--soft);border:2px solid var(--accent)}.bar{height:18px;background:var(--accent);min-width:1px;border-radius:3px}.barrow{display:grid;grid-template-columns:70px 1fr 55px;align-items:center;gap:8px;margin:8px 0}.caption{color:var(--muted);font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:14px;border-radius:8px;background:var(--soft);font:13px/1.6 ui-monospace,monospace}.controls{display:grid;gap:14px;margin-top:12px}.controls label{display:grid;gap:4px}input{width:100%;accent-color:var(--accent)}details{border-top:1px solid var(--border);padding-top:12px;margin-top:14px}summary{cursor:pointer}.result{font-weight:600;color:var(--green)}svg{width:100%;height:auto;max-height:225px}svg text{font:14px system-ui;fill:var(--text)}@media(max-width:380px){.demo{padding:10px}.scene{padding:12px}.equation{font-size:17px}}
</style>
<main class="demo"><div class="eyebrow">NumPy / guided derivation</div><h1>Two layers, one gradient at a time</h1><p class="caption">A small, synthetic example. Follow one operation before moving on.</p><nav class="nav" aria-label="Lesson navigation"><button id="prev" aria-label="Previous step">←</button><select id="step" aria-label="Choose derivation step"></select><button id="next" aria-label="Next step">→</button><button id="reset">Reset</button></nav>
<section class="scene" aria-labelledby="title"><div id="phase" class="eyebrow"></div><h2 id="title"></h2><div id="equation" class="equation"></div><div id="figure" class="figure"></div><p id="explanation" aria-live="polite"></p><pre><code id="code"></code></pre><div id="shape" class="caption"></div></section>
<details open><summary>Change the example</summary><div class="controls"><label>First input x₀: <output id="xout">1.00</output><input id="x" type="range" min="-2" max="2" step=".1" value="1"></label><label>First sample's true class<select id="label"><option value="0">Class 0</option><option value="1">Class 1</option><option value="2">Class 2</option></select></label><label>Repeat the entire batch<select id="repeat"><option value="1">Once · N = 3</option><option value="3">Three times · N = 9</option></select></label><label>Learning rate<select id="lr"><option value="0">0 · no update</option><option value="0.1" selected>0.1</option><option value="0.5">0.5</option></select></label></div></details><p class="caption">Controls recompute a single step from the same starting weights. Symbols are teaching notation, not required attribute names.</p><noscript>This walkthrough needs JavaScript.</noscript></main>
<script>
// BEGIN MATH
const PARAMS={W1:[[.6,-.4],[.3,.8]],b1:[.1,-.1],W2:[[.7,-.3,.2],[-.2,.5,.4]],b2:[0,.1,-.1]};
const transpose=a=>a[0].map((_,j)=>a.map(r=>r[j]));
const matmul=(a,b)=>a.map(row=>b[0].map((_,j)=>row.reduce((s,v,k)=>s+v*b[k][j],0)));
const sumRows=a=>a[0].map((_,j)=>a.reduce((s,r)=>s+r[j],0));
function forward(X,y,p){const A=matmul(X,p.W1).map(r=>r.map((v,j)=>v+p.b1[j]));const H=A.map(r=>r.map(v=>Math.max(0,v)));const Z=matmul(H,p.W2).map(r=>r.map((v,j)=>v+p.b2[j]));const P=Z.map(r=>{const e=r.map(v=>Math.exp(v-Math.max(...r)));return e.map(v=>v/e.reduce((a,b)=>a+b,0))});const loss=Z.reduce((s,r,i)=>{const m=Math.max(...r);return s+m+Math.log(r.reduce((a,v)=>a+Math.exp(v-m),0))-r[y[i]]},0)/X.length;return {A,H,Z,P,loss}}
function compute(x=1,label=0,repeats=1,lr=.1,params=PARAMS){const base=[[x,-.5],[.2,1],[-.8,.3]],labels=[label,1,2];const X=Array.from({length:repeats},()=>base).flat(),y=Array.from({length:repeats},()=>labels).flat();const f=forward(X,y,params);const G=f.P.map((r,i)=>r.map((v,j)=>(v-Number(j===y[i]))/X.length));const dH=matmul(G,transpose(params.W2));const dA=dH.map((r,i)=>r.map((v,j)=>f.A[i][j]>0?v:0));const gradients={W1:matmul(transpose(X),dA),b1:sumRows(dA),W2:matmul(transpose(f.H),G),b2:sumRows(G)};const update=(p,g)=>p.map((v,i)=>Array.isArray(v)?update(v,g[i]):v-lr*g[i]);const updatedParameters=Object.fromEntries(Object.entries(params).map(([k,v])=>[k,update(v,gradients[k])]));return {X,y,...f,G,dH,dA,gradients,parameters:params,updatedParameters,updatedLoss:forward(X,y,updatedParameters).loss}}
// END MATH
const $=id=>document.getElementById(id),fmt=v=>(Math.abs(v)<.00005?0:v).toFixed(4),vec=a=>a.map(fmt).join(' · ');
const tile=(title,body)=>`<div class="tile"><strong>${title}</strong><div class="numbers">${body}</div></div>`,arrow='<div class="arrow" aria-hidden="true">↓</div>';
const matrix=(a,focus)=>`<div class="matrix" style="grid-template-columns:repeat(${a[0].length},minmax(0,1fr))">${a.map((r,i)=>r.map((v,j)=>`<span class="cell ${focus&&focus(i,j)?'selected':''}">${fmt(v)}</span>`).join('')).join('')}</div>`;
const bars=p=>p.map((v,j)=>`<div class="barrow"><span>Class ${j}</span><div><div class="bar" style="width:${100*v}%"></div></div><span>${fmt(v)}</span></div>`).join('');
const steps=[
['Forward','Start with one batch','X → A → H → Z → P → L','Three examples travel through two affine layers. We inspect row 0; gradients later combine every row.','N = X.shape[0]','X [N, D] · D = 2 · hidden width K = 2 · classes C = 3'],
['Forward','First affine layer','A = XW₁ + b₁','Each output combines one input row with one weight column. The bias is added to every row.','A = X @ W1 + b1','[N, D] @ [D, K] + [K] → [N, K]'],
['Forward','ReLU opens a gate','H = max(0, A)','Negative preactivations become zero. Move the input slider to cross the zero threshold.','H = np.maximum(0, A)','A and H [N, K]'],
['Forward','Second affine layer','Z = HW₂ + b₂','Hidden features combine into three class scores. Scores are not probabilities yet.','Z = H @ W2 + b2','[N, K] @ [K, C] + [C] → [N, C]'],
['Forward','Normalize the scores','pⱼ = exp(zⱼ − m) / Σₖ exp(zₖ − m)','Subtract the row maximum m before exponentiating. Every class shares the same denominator.','shifted = Z - Z.max(axis=1, keepdims=True)\ne = np.exp(shifted)\nP = e / e.sum(axis=1, keepdims=True)','P [N, C] · each row sums to 1'],
['Loss','Pick the true class','ℓ = −log(pᵧ)','For one sample, use the probability assigned to its true class. Change the label to see which bar matters.','per_sample = -np.log(P[np.arange(N), y])\nL = per_sample.mean()','y [N] · per_sample [N] · L scalar'],
['Derivation','Expand cross-entropy','ℓ = −Σⱼ yⱼzⱼ + log Σₖ exp(zₖ)','Here y is one-hot for one sample. Its entries sum to 1, so the shared log-normalizer appears only once.','ell = -Z[0, y[0]] + logsumexp(Z[0])\n# logsumexp is mathematical shorthand','One sample · yⱼ = 1 only for the true class'],
['Derivation','Differentiate one score','∂ℓ/∂zᵢ = −yᵢ + pᵢ','The label term contributes −yᵢ. The derivative of log-sum-exp is exp(zᵢ) / Σ exp(z), which is pᵢ.','one_hot = np.zeros_like(P)\none_hot[np.arange(N), y] = 1\nper_sample_gradient = P - one_hot','One row: prediction minus one-hot label'],
['Backward','Average over samples','G = (P − one_hot(y)) / N','The loss is a mean, so the gradient also divides by N. Repeating the batch makes each row smaller but leaves the summed parameter gradient unchanged.','G = (P - one_hot) / N','G = ∂L/∂Z [N, C] · divide by batch size, not class count'],
['Backward','Accumulate layer 2 gradients','dW₂ = HᵀG; db₂ = Σrows G','A shared weight gets one contribution from each sample. Highlighted cells contribute to dW₂[0, 0].','dW2 = H.T @ G\ndb2 = G.sum(axis=0)','[K, N] @ [N, C] → [K, C]; db₂ [C]'],
['Backward','Send gradients to hidden units','dH = GW₂ᵀ','Each hidden unit receives a sum over all class paths. Use the original W₂, before the optimizer update.','dH = G @ W2.T','[N, C] @ [C, K] → [N, K]'],
['Backward','Pass through the ReLU gate','dA = dH ⊙ 1[A > 0]','Only gates that were positive during the forward pass transmit gradients. At zero, this implementation chooses derivative zero.','dA = dH * (A > 0)','dA [N, K] · reuse the forward preactivations'],
['Backward','Accumulate layer 1 gradients','dW₁ = XᵀdA; db₁ = Σrows dA','The same affine rule applies again: input values multiply upstream gradients, summed across samples.','dW1 = X.T @ dA\ndb1 = dA.sum(axis=0)','[D, N] @ [N, K] → [D, K]; db₁ [K]'],
['Update','Take one gradient step','θnew = θ − learning_rate · dθ','Compute all gradients first, then update both layers. The reported loss is recomputed with the new parameters; a large step is not guaranteed to improve it.','W1 -= learning_rate * dW1\nb1 -= learning_rate * db1\nW2 -= learning_rate * dW2\nb2 -= learning_rate * db2\nreturn loss(X, y)','All controls restart from the same toy weights']];
$('step').innerHTML=steps.map((s,i)=>`<option value="${i}">${i+1} / ${steps.length} · ${s[1]}</option>`).join('');
function render(){const k=+$('step').value,d=compute(+$('x').value,+$('label').value,+$('repeat').value,+$('lr').value),s=steps[k],n=d.X.length; $('xout').textContent=(+$('x').value).toFixed(2);['phase','title','equation','explanation','code','shape'].forEach((id,i)=>$(id).textContent=s[i]);let v='';
if(k===0)v=tile(`X · ${n} rows × 2 features`,matrix(d.X.slice(0,3),(i)=>i===0))+arrow+tile('Two affine layers','2 features → 2 hidden units → 3 classes')+tile('True labels',d.y.join(' · '));
if(k===1)v=tile('Input row 0',vec(d.X[0]))+arrow+tile('Column 0 of W₁',vec(d.parameters.W1.map(r=>r[0])))+tile('A[0, 0]',`${fmt(d.X[0][0])} × 0.6 + (−0.5) × 0.3 + 0.1 = ${fmt(d.A[0][0])}`);
if(k===2){const a=d.A[0][0];v=`<svg viewBox="0 0 320 220" role="img" aria-label="ReLU curve with selected preactivation"><path d="M30 170H290 M160 195V20" stroke="var(--muted)" fill="none"/><path d="M40 170H160L275 55" stroke="var(--accent)" stroke-width="4" fill="none"/><circle cx="${160+a*65}" cy="${170-Math.max(0,a)*65}" r="7" fill="var(--green)"/><text x="150" y="212">0</text><text x="245" y="195">A →</text><text x="175" y="30">H</text></svg>`+tile('Row 0: gate input → output',`${vec(d.A[0])}<br>↓<br>${vec(d.H[0])}`)}
if(k===3)v=tile('Hidden row 0',vec(d.H[0]))+arrow+tile('Class 0 contraction',`${fmt(d.H[0][0])} × 0.7 + ${fmt(d.H[0][1])} × (−0.2) + 0 = ${fmt(d.Z[0][0])}`)+tile('All logits',vec(d.Z[0]));
if(k===4)v=tile('Logits · row 0',vec(d.Z[0]))+arrow+bars(d.P[0])+`<p class="result">Sum = ${fmt(d.P[0].reduce((a,b)=>a+b))}</p>`;
if(k===5)v=bars(d.P[0])+tile(`True class ${d.y[0]}`,`−log(${fmt(d.P[0][d.y[0]])}) = ${fmt(-Math.log(d.P[0][d.y[0]]))}`)+tile('Batch mean loss',fmt(d.loss));
if(k===6)v=tile('Substitute softmax','−Σⱼ yⱼ log(exp(zⱼ) / Σₖ exp(zₖ))')+arrow+tile('Split the logarithm','−Σⱼ yⱼzⱼ + (Σⱼ yⱼ) log Σₖ exp(zₖ)')+arrow+tile('One-hot labels sum to one',`−z[${d.y[0]}] + log Σₖ exp(zₖ) = ${fmt(-Math.log(d.P[0][d.y[0]]))}`);
if(k===7)v=tile('Derivative of the label term',`−one_hot = ${[0,1,2].map(j=>j===d.y[0]?'−1':'0').join(' · ')}`)+tile('Derivative of the normalizer',vec(d.P[0]))+arrow+tile('Add the two paths',vec(d.P[0].map((p,j)=>p-Number(j===d.y[0]))));
if(k===8){const base=compute(+$('x').value,+$('label').value,1,+$('lr').value);v=tile(`Current batch N = ${n}: G row 0`,vec(d.G[0]))+arrow+tile('Sum across samples: db₂',vec(d.gradients.b2))+tile('Original 3-sample batch: db₂',vec(base.gradients.b2))+`<p class="result">Same aggregate gradient, even after duplication.</p>`}
if(k===9)v=tile('H · first 3 rows (column 0 selected)',matrix(d.H.slice(0,3),(_,j)=>j===0))+tile('G · first 3 rows (class 0 selected)',matrix(d.G.slice(0,3),(_,j)=>j===0))+tile('Sum all N contributions to dW₂[0, 0]',`${d.H.slice(0,3).map((r,i)=>`${fmt(r[0])} × ${fmt(d.G[i][0])}`).join(' + ')}${n>3?' (repeated 3 times)':''} = ${fmt(d.gradients.W2[0][0])}`);
if(k===10)v=tile('G row 0 · class paths',vec(d.G[0]))+arrow+tile('Weights from hidden unit 0',vec(d.parameters.W2[0]))+tile('Sum class contributions → dH[0, 0]',`${d.G[0].map((g,j)=>`${fmt(g)} × ${fmt(d.parameters.W2[0][j])}`).join(' + ')} = ${fmt(d.dH[0][0])}`);
if(k===11)v=tile('Upstream dH row 0',vec(d.dH[0]))+arrow+tile('Gate from A row 0',d.A[0].map(a=>`${fmt(a)} → ${a>0?'OPEN (1)':'CLOSED (0)'}`).join('<br>'))+arrow+tile('Downstream dA row 0',vec(d.dA[0]));
if(k===12)v=tile('X column 0 × dA column 0 · first 3 rows',d.X.slice(0,3).map((r,i)=>`${fmt(r[0])} × ${fmt(d.dA[i][0])}`).join('<br>'))+arrow+tile(`Sum all ${n} rows → dW₁[0, 0]`,fmt(d.gradients.W1[0][0]))+tile('dW₁ · complete matrix',matrix(d.gradients.W1,(i,j)=>i===0&&j===0));
if(k===13)v=tile('One weight: W₁[0, 0]',`${fmt(d.parameters.W1[0][0])} − ${$('lr').value} × ${fmt(d.gradients.W1[0][0])}`)+arrow+tile('Updated W₁[0, 0]',fmt(d.updatedParameters.W1[0][0]))+tile('Mean loss · before → after',`${fmt(d.loss)} → ${fmt(d.updatedLoss)}`);
$('figure').innerHTML=v;$('prev').disabled=k===0;$('next').disabled=k===steps.length-1;reportHeight()}
$('prev').onclick=()=>{$('step').value=+$('step').value-1;render()};$('next').onclick=()=>{$('step').value=+$('step').value+1;render()};$('reset').onclick=()=>{$('step').value=0;$('x').value=1;$('label').value=0;$('repeat').value=1;$('lr').value=.1;render()};['step','x','label','repeat','lr'].forEach(id=>$(id).addEventListener(id==='x'?'input':'change',render));
function reportHeight(){window.parent.postMessage({type:'deepcode:interactive-demo-height',version:1,height:Math.ceil(document.querySelector('.demo').getBoundingClientRect().height)},'*')}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.type!=='deepcode:interactive-demo-theme'||e.data?.version!==1)return;const map={background:'bg',surface:'surface',text:'text',muted:'muted',border:'border',accent:'accent',accentSoft:'soft',positive:'green'};for(const [key,name] of Object.entries(map))if(typeof e.data.tokens?.[key]==='string')document.documentElement.style.setProperty('--'+name,e.data.tokens[key]);reportHeight()});new ResizeObserver(reportHeight).observe(document.querySelector('.demo'));window.parent.postMessage({type:'deepcode:interactive-demo-ready',version:1},'*');render();
</script></html>
