<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Real-time milestone counter architecture</title>
  <desc id="desc">Completion events are deduplicated and persisted, then a consumer derives a versioned counter and broadcasts it to live viewers.</desc>
  <defs>
    <style>
      .bg{fill:#f7f8fb}.box{fill:#fff;stroke:#aeb7c8;stroke-width:2}.accent{fill:#e8f2ff;stroke:#4b89d8;stroke-width:2}.warm{fill:#fff4df;stroke:#d79c39;stroke-width:2}.text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2937}.heading{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#566276}.arrow{stroke:#53657d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#53657d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560" rx="24"/>
  <text x="56" y="64" class="text heading">Real-time milestone counter: durable events → derived versioned snapshot</text>
  <rect x="62" y="170" width="190" height="125" rx="14" class="box"/>
  <text x="88" y="215" class="text heading">Clients</text><text x="88" y="247" class="text body">Completion events</text><text x="88" y="273" class="text small">viewer connections</text>
  <rect x="335" y="150" width="220" height="165" rx="14" class="accent"/>
  <text x="365" y="195" class="text heading">Ingest API</text><text x="365" y="228" class="text body">authenticate + validate</text><text x="365" y="256" class="text body">dedupe event_id</text><text x="365" y="284" class="text small">return event receipt</text>
  <rect x="640" y="120" width="220" height="130" rx="14" class="box"/>
  <text x="675" y="165" class="text heading">Event store</text><text x="675" y="198" class="text body">immutable events</text><text x="675" y="224" class="text small">source of truth</text>
  <rect x="640" y="325" width="220" height="130" rx="14" class="warm"/>
  <text x="667" y="370" class="text heading">Counter consumer</text><text x="667" y="403" class="text body">ordered by workflow</text><text x="667" y="429" class="text small">idempotent projection</text>
  <rect x="940" y="325" width="195" height="130" rx="14" class="accent"/>
  <text x="971" y="370" class="text heading">Live gateway</text><text x="971" y="403" class="text body">SSE / WebSocket</text><text x="971" y="429" class="text small">fan-out snapshot</text>
  <rect x="940" y="120" width="195" height="130" rx="14" class="box"/>
  <text x="974" y="165" class="text heading">Counter row</text><text x="974" y="198" class="text body">count + version</text><text x="974" y="224" class="text small">reconnect reads</text>
  <path d="M252 232 H335" class="arrow"/><path d="M555 202 H640" class="arrow"/><path d="M750 250 V325" class="arrow"/><path d="M860 390 H940" class="arrow"/><path d="M860 390 C900 390 900 185 940 185" class="arrow"/><path d="M1037 325 V250" class="arrow"/><path d="M1037 455 C1037 500 155 500 155 295" class="arrow"/>
  <text x="359" y="355" class="text small">idempotent acceptance before asynchronous fan-out</text>
</svg>
