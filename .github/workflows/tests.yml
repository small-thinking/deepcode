name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --locked --python ${{ matrix.python-version }} python -m unittest discover -s tests
