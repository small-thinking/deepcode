name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository without LFS smudge
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Verify no tracked platform files
        run: |
          tracked_platform_files=$(git ls-files .DS_Store '*/.DS_Store')
          if [ -n "$tracked_platform_files" ]; then
            echo "$tracked_platform_files"
            echo "Tracked .DS_Store files are not allowed."
            exit 1
          fi

      - name: Verify architecture image is stored with Git LFS
        run: |
          git check-attr filter -- docs/assets/deepcode-local-architecture.png
          git check-attr filter -- docs/assets/deepcode-local-architecture.png | grep 'filter: lfs'
          test "$(git cat-file -s HEAD:docs/assets/deepcode-local-architecture.png)" -lt 1000

      - name: Verify README architecture image target exists
        run: test -f docs/assets/deepcode-local-architecture.png

  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --locked --python ${{ matrix.python-version }} python -m unittest discover -s tests
